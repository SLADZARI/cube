<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Soup Test A · v5</title><style>:root{--dot:44px;}*{box-sizing:border-box;}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#079dcc;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}#game{position:fixed;inset:0;width:100%;height:100%;display:block}#dock{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;background:rgba(238,250,255,.095);border:1px solid rgba(255,255,255,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 30px rgba(0,50,70,.18);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);}button{width:var(--dot);height:var(--dot);border:0;border-radius:50%;padding:0;flex:0 0 auto;box-shadow:inset 0 1px 2px rgba(255,255,255,.58),inset 0 -5px 12px rgba(0,0,0,.20),0 3px 11px rgba(0,0,0,.18);}#change{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.85) 0 7%,rgba(255,255,255,.24) 29%,rgba(255,255,255,.07) 68%,rgba(255,255,255,.15) 100%);}#choices{display:none;gap:8px;align-items:center}#choices.open{display:flex}.choice{transform:scale(.01);opacity:0;animation:pop .18s cubic-bezier(.2,.9,.25,1.15) forwards}.yellow{background:radial-gradient(circle at 34% 27%,#fffbd5 0 7%,#ffe42b 32%,#f2af00 74%,#a96500 100%)}.blue{background:radial-gradient(circle at 34% 27%,#dffcff 0 7%,#39c6ff 32%,#0875e8 74%,#083b90 100%)}.green{background:radial-gradient(circle at 34% 27%,#efffcf 0 7%,#69f33f 32%,#19ac35 74%,#087027 100%)}@keyframes pop{to{transform:scale(1);opacity:1}}</style></head><body><canvas id="game"></canvas><div id="dock"><button id="change" aria-label="сменить цвет"></button><div id="choices"></div></div><script>(()=>{'use strict';const canvas=document.getElementById('game');const ctx=canvas.getContext('2d',{alpha:false});const dock=document.getElementById('dock');const changeBtn=document.getElementById('change');const choicesEl=document.getElementById('choices');let W=390,H=844,DPR=1,last=performance.now()/1000;const pal={yellow:{base:'#ffd31b',light:'#fff06a',mid:'#d89d00',deep:'#201300'},blue:{base:'#12aff7',light:'#8cecff',mid:'#0878ce',deep:'#03161f'},green:{base:'#62ef28',light:'#d6ff83',mid:'#179438',deep:'#051506'}};const state={color:'yellow',from:'yellow',to:'yellow',colorMix:1,changes:1,unlocked:['blue'],manualSinceDigest:false,digests:0,pointer:false,px:0,py:0,choicesOpen:false,reaction:null};const body=[];function node(x,y,r,seed){return{x,y,r,vx:0,vy:0,seed,breath:.46+Math.random()*.28,wobble:.31+Math.random()*.36};}const regions=[{id:'blue',required:'blue',result:'green',color:'blue',x:.71,y:.33,r:.078,alive:true,phase:1.1,lobes:7,activity:.24,reward:2},{id:'green',required:'green',result:'green',color:'green',x:.73,y:.66,r:.084,alive:true,phase:2.8,lobes:10,activity:.46,reward:2}];const membranes=[[.02,.15,.13],[.98,.10,.13],[.02,.82,.15],[.98,.86,.17],[.14,.96,.10],[.92,.50,.09],[.06,.49,.075],[.54,.02,.07]];function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(2,Math.floor(W*DPR));canvas.height=Math.max(2,Math.floor(H*DPR));canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);if(!body.length)body.push(node(W*.27,H*.56,Math.min(W,H)*.083,1.7));}addEventListener('resize',resize,{passive:true});resize();function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function lerp(a,b,t){return a+(b-a)*t}function ease(t){return 1-Math.pow(1-t,3)}function rgb(hex){const n=parseInt(hex.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}function mixColor(a,b,t){const A=rgb(a),B=rgb(b);return`rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`;}function currentPalette(){if(state.colorMix>=1)return pal[state.color];const A=pal[state.from],B=pal[state.to],t=state.colorMix;return{base:mixColor(A.base,B.base,t),light:mixColor(A.light,B.light,t),mid:mixColor(A.mid,B.mid,t),deep:mixColor(A.deep,B.deep,t)};}function available(){if(state.changes<=0)return[];return state.unlocked.filter(c=>c!==state.color);}function closeChoices(){state.choicesOpen=false;choicesEl.className='';choicesEl.innerHTML='';}function refreshChoices(){const a=available();choicesEl.innerHTML='';if(!state.choicesOpen||!a.length){closeChoices();return}a.forEach((color,i)=>{const b=document.createElement('button');b.className='choice '+color;b.style.animationDelay=(i*.025)+'s';b.setAttribute('aria-label',color);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();manualSwitch(color);});choicesEl.appendChild(b);});choicesEl.classList.add('open');}changeBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!available().length){closeChoices();return}state.choicesOpen=!state.choicesOpen;refreshChoices();});function manualSwitch(c){if(!available().includes(c))return;state.changes--;state.manualSinceDigest=true;state.from=state.color;state.to=c;state.colorMix=0;closeChoices();}function pointerPos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;const p=pointerPos(e);state.pointer=true;state.px=p.x;state.py=p.y;try{canvas.setPointerCapture(e.pointerId)}catch(_){}closeChoices();});canvas.addEventListener('pointermove',e=>{if(!state.pointer)return;const p=pointerPos(e);state.px=p.x;state.py=p.y;});function endPointer(e){state.pointer=false;try{canvas.releasePointerCapture(e.pointerId)}catch(_){}}canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);function updateBody(dt,t){const head=body[0];if(state.pointer){const dx=state.px-head.x,dy=state.py-head.y,d=Math.hypot(dx,dy)+.001;const accel=Math.min(1500,300+d*4.1);head.vx+=dx/d*accel*dt;head.vy+=dy/d*accel*dt;}else{head.vx+=Math.sin(t*.61+head.seed)*7*dt;head.vy+=Math.cos(t*.47+head.seed*.8)*6*dt;}const dam=Math.exp(-4.5*dt);head.vx*=dam;head.vy*=dam;let sp=Math.hypot(head.vx,head.vy);if(sp>850){head.vx=head.vx/sp*850;head.vy=head.vy/sp*850}head.x+=head.vx*dt;head.y+=head.vy*dt;head.x=clamp(head.x,head.r*.65,W-head.r*.65);head.y=clamp(head.y,head.r*.65,H-head.r*.65);for(let i=1;i<body.length;i++){const n=body[i],prev=body[i-1];const dx=prev.x-n.x,dy=prev.y-n.y,d=Math.hypot(dx,dy)+.001;const rest=(prev.r+n.r)*.47;const stretch=d-rest;const k=15+Math.min(25,Math.abs(stretch)*.10);n.vx+=dx/d*stretch*k*dt;n.vy+=dy/d*stretch*k*dt;const idle=state.pointer?1.5:4.8;n.vx+=Math.sin(t*n.wobble+n.seed+i*.7)*idle*dt;n.vy+=Math.cos(t*n.wobble*.8+n.seed-i*.5)*idle*dt;const nd=Math.exp(-5.6*dt);n.vx*=nd;n.vy*=nd;n.x+=n.vx*dt;n.y+=n.vy*dt;}}function beginReaction(r){const h=body[0];state.reaction={region:r,t:0,dur:.62,sx:r.x,sy:r.y,hx:h.x/W,hy:h.y/H};}function finishReaction(r){r.alive=false;const clean=!state.manualSinceDigest;state.from=state.color;state.to=r.result;state.colorMix=0;state.color=r.result;for(let k=0;k<r.reward;k++){const tail=body[body.length-1];const rr=Math.max(body[0].r*.48,body[0].r*(.73-body.length*.035));body.push(node(tail.x+(Math.random()-.5)*6,tail.y+(Math.random()-.5)*6,rr,r.phase*10+k));}if(clean&&state.digests>0)state.changes++;state.manualSinceDigest=false;state.digests++;if(r.id==='green')state.unlocked=['yellow','blue'];state.reaction=null;closeChoices();}function updateRegions(dt,t){if(state.reaction){state.reaction.t+=dt/state.reaction.dur;if(state.reaction.t>=1)finishReaction(state.reaction.region);}const h=body[0];for(const r of regions){if(!r.alive||state.reaction&&state.reaction.region===r)continue;const cx=r.x*W,cy=r.y*H,rr=r.r*H;const d=Math.hypot(h.x-cx,h.y-cy);if(d<h.r*.64+rr*.73){if(state.color===r.required&&state.colorMix>.82)beginReaction(r);else{const ux=(h.x-cx)/(d+.001),uy=(h.y-cy)/(d+.001);h.vx+=ux*90*dt;h.vy+=uy*90*dt;}}}}function updateColor(dt){if(state.colorMix<1){state.colorMix=Math.min(1,state.colorMix+dt*2.6);if(state.colorMix>=1){state.color=state.to;state.from=state.to;}}}function drawBackground(t){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#28c4e9');g.addColorStop(.45,'#069ed1');g.addColorStop(1,'#047db1');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<6;i++){const x=(.12+i*.18+Math.sin(t*.034+i*1.6)*.035)*W;const y=(.13+(i%3)*.34+Math.cos(t*.027+i*2.0)*.05)*H;const rr=Math.min(W,H)*(.28+.04*(i%2));const rg=ctx.createRadialGradient(x,y,0,x,y,rr);rg.addColorStop(0,'rgba(155,241,255,.13)');rg.addColorStop(.6,'rgba(0,158,205,.035)');rg.addColorStop(1,'rgba(0,70,105,0)');ctx.fillStyle=rg;ctx.fillRect(x-rr,y-rr,rr*2,rr*2);}ctx.globalAlpha=.22;for(let i=0;i<55;i++){const x=((i*79.1+31)%W),y=((i*149.7+57)%H),rr=.55+(i%4)*.24;ctx.fillStyle=i%6===0?'#06232e':'#c9f7ff';ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;membranes.forEach((b,i)=>glassBubble(b[0]*W+Math.sin(t*.07+i)*2,b[1]*H+Math.cos(t*.06+i)*2,b[2]*Math.min(W,H)));}function glassBubble(x,y,r){const g=ctx.createRadialGradient(x-r*.27,y-r*.31,r*.02,x,y,r);g.addColorStop(0,'rgba(255,255,255,.11)');g.addColorStop(.75,'rgba(208,249,255,.028)');g.addColorStop(1,'rgba(255,241,166,.18)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.48)';ctx.lineWidth=Math.max(1.2,r*.018);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.40)';ctx.beginPath();ctx.ellipse(x-r*.32,y-r*.38,r*.18,r*.065,-.52,0,Math.PI*2);ctx.fill();}function pearl(x,y,r,a=1){const g=ctx.createRadialGradient(x-r*.34,y-r*.38,r*.02,x,y,r);g.addColorStop(0,`rgba(255,255,255,${.48*a})`);g.addColorStop(.13,`rgba(52,62,64,${.58*a})`);g.addColorStop(.38,`rgba(6,8,8,${.98*a})`);g.addColorStop(1,`rgba(0,0,0,${a})`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}function organicBlob(cx,cy,r,t,phase,lobes,amp,color){const p=ctx;p.beginPath();for(let i=0;i<=72;i++){const a=i/72*Math.PI*2;const rr=r*(1+amp*Math.sin(a*lobes+t*.42+phase)+amp*.30*Math.sin(a*(lobes+4)-t*.24+phase*1.6));const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;if(i===0)p.moveTo(x,y);else p.lineTo(x,y);}p.closePath();}function drawRegion(r,t){if(!r.alive)return;let cx=r.x*W,cy=r.y*H,scale=1;if(state.reaction&&state.reaction.region===r){const q=clamp(state.reaction.t,0,1),e=ease(q),h=body[0];cx=lerp(r.x*W,h.x,e);cy=lerp(r.y*H,h.y,e);scale=1-e*.96;}const radius=r.r*H*scale*(1+.022*Math.sin(t*(r.id==='green'?.87:.54)+r.phase));if(radius<1)return;const P=pal[r.color];ctx.save();ctx.lineCap='round';ctx.lineJoin='round';const fingers=r.id==='green'?8:6;for(let k=0;k<fingers;k++){const a=r.phase+k*(Math.PI*2/fingers)+Math.sin(t*.09+k*1.4)*.055;const len=radius*(1.15+.32*((k*3)%5)/4);const w=radius*(r.id==='green'?.19:.16)*(1+.18*Math.sin(k*2.2));ctx.strokeStyle=P.base;ctx.globalAlpha=.88;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*radius*.42,cy+Math.sin(a)*radius*.42);ctx.bezierCurveTo(cx+Math.cos(a+.20)*radius*.78,cy+Math.sin(a+.20)*radius*.72,cx+Math.cos(a-.18)*len*.82,cy+Math.sin(a-.18)*len*.72,cx+Math.cos(a)*len,cy+Math.sin(a)*len);ctx.stroke();if(k%2===0){ctx.strokeStyle='rgba(0,0,0,.64)';ctx.globalAlpha=.68;ctx.lineWidth=Math.max(1.2,w*.25);ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*radius*.38,cy+Math.sin(a)*radius*.38);ctx.bezierCurveTo(cx+Math.cos(a+.14)*radius*.78,cy+Math.sin(a+.14)*radius*.70,cx+Math.cos(a-.12)*len*.80,cy+Math.sin(a-.12)*len*.68,cx+Math.cos(a)*len*.98,cy+Math.sin(a)*len*.98);ctx.stroke();}}ctx.globalAlpha=1;const lobes=r.id==='green'?[[0,0,1.0],[-.46,-.18,.62],[.43,-.25,.58],[-.30,.43,.56],[.44,.38,.52],[.06,-.52,.50]]:[[0,0,1.0],[-.42,-.12,.60],[.39,-.29,.52],[-.28,.39,.55],[.45,.30,.48]];for(let li=lobes.length-1;li>=0;li--){const L=lobes[li];const lx=cx+L[0]*radius,ly=cy+L[1]*radius,lr=radius*L[2];const g=ctx.createRadialGradient(lx-lr*.23,ly-lr*.26,lr*.02,lx,ly,lr*1.05);g.addColorStop(0,P.light);g.addColorStop(.24,P.base);g.addColorStop(.72,P.mid);g.addColorStop(1,r.id==='green'?'#0b451d':'#075f98');ctx.fillStyle=g;organicBlob(lx,ly,lr,t,r.phase+li*.7,r.lobes+(li%3),r.id==='green'?.09:.065,r.color);ctx.fill();}ctx.globalAlpha=.48;ctx.strokeStyle='rgba(0,0,0,.68)';const bands=r.id==='green'?13:9;for(let k=0;k<bands;k++){const yoff=(k-(bands-1)/2)*radius*.085;ctx.lineWidth=Math.max(1,radius*(.018+.004*(k%3)));ctx.beginPath();for(let i=0;i<=24;i++){const q=i/24;const xx=cx-radius*.74+q*radius*1.48;const yy=cy+yoff+Math.sin(q*8.0+k*.73+t*r.activity)*radius*(.07+.012*(k%2));if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);}ctx.stroke();}ctx.globalAlpha=1;const count=r.id==='green'?18:11;for(let i=0;i<count;i++){const a=i*2.399+r.phase+t*(.021+.002*i);const rr=radius*(.16+.68*((i*7)%17)/17);const bx=cx+Math.cos(a)*rr;const by=cy+Math.sin(a)*rr*.76;const br=radius*(i%7===0?.105:.035+.013*(i%4));pearl(bx,by,br,.94);}if(r.id==='green'){ctx.fillStyle='rgba(0,0,0,.55)';for(let i=0;i<34;i++){const a=i*1.731+r.phase;const rr=radius*(.18+.75*((i*11)%31)/31);const bx=cx+Math.cos(a+t*.014)*rr;const by=cy+Math.sin(a-t*.011)*rr*.79;ctx.beginPath();ctx.arc(bx,by,Math.max(.7,radius*(.010+.007*(i%3))),0,Math.PI*2);ctx.fill();}}ctx.fillStyle='rgba(255,255,255,.42)';ctx.beginPath();ctx.ellipse(cx-radius*.34,cy-radius*.42,radius*.15,radius*.052,-.48,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(cx+radius*.22,cy-radius*.23,radius*.08,radius*.028,-.28,0,Math.PI*2);ctx.fill();ctx.restore();}function bodyContour(t){if(body.length===1){const h=body[0],r=h.r*(1+.025*Math.sin(t*h.breath+h.seed));ctx.beginPath();for(let i=0;i<=64;i++){const a=i/64*Math.PI*2;const rr=r*(1+.045*Math.sin(a*6+t*.42)+.018*Math.sin(a*11-t*.23));const x=h.x+Math.cos(a)*rr,y=h.y+Math.sin(a)*rr;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.closePath();return;}const left=[],right=[];for(let i=0;i<body.length;i++){const n=body[i],prev=body[Math.max(0,i-1)],next=body[Math.min(body.length-1,i+1)];const dx=next.x-prev.x,dy=next.y-prev.y,L=Math.hypot(dx,dy)||1;const nx=-dy/L,ny=dx/L;const rr=n.r*(1+.022*Math.sin(t*n.breath+n.seed));left.push([n.x+nx*rr,n.y+ny*rr]);right.push([n.x-nx*rr,n.y-ny*rr]);}ctx.beginPath();ctx.moveTo(left[0][0],left[0][1]);for(let i=1;i<left.length;i++){const a=left[i-1],b=left[i];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}const last=body[body.length-1];ctx.quadraticCurveTo(left[left.length-1][0],left[left.length-1][1],last.x,last.y);for(let i=right.length-1;i>=1;i--){const a=right[i],b=right[i-1];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}const h=body[0];ctx.quadraticCurveTo(right[0][0],right[0][1],h.x,h.y);ctx.closePath();}function drawPlayer(t){const P=currentPalette(),h=body[0];ctx.save();bodyContour(t);const g=ctx.createRadialGradient(h.x-h.r*.28,h.y-h.r*.35,h.r*.04,h.x,h.y,h.r*1.8);g.addColorStop(0,P.light);g.addColorStop(.30,P.base);g.addColorStop(.74,P.mid);g.addColorStop(1,'#080908');ctx.fillStyle=g;ctx.shadowBlur=14;ctx.shadowColor='rgba(255,255,255,.26)';ctx.fill();ctx.shadowBlur=0;bodyContour(t);ctx.clip();if(body.length>1){ctx.lineCap='round';for(let k=0;k<10;k++){ctx.beginPath();for(let i=0;i<body.length;i++){const n=body[i],prev=body[Math.max(0,i-1)],next=body[Math.min(body.length-1,i+1)];const dx=next.x-prev.x,dy=next.y-prev.y,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;const off=Math.sin(k*1.77+i*.63+t*(.13+.016*k))*n.r*(.10+.045*(k%5));const x=n.x+nx*off,y=n.y+ny*off;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.strokeStyle=k%3===0?P.light:'rgba(0,0,0,.76)';ctx.globalAlpha=k%3===0?.60:.78;ctx.lineWidth=Math.max(1.2,h.r*(k%3===0?.025:.035+.005*(k%2)));ctx.stroke();}ctx.globalAlpha=1;}if(body.length===1){pearl(h.x,h.y,h.r*.32,1);}else{const bs=[[-.18,-.15,.21],[.17,-.18,.18],[.03,.12,.22],[-.26,.17,.13],[.28,.12,.12],[.00,-.38,.10]];bs.forEach((b,i)=>{const a=t*.09+i*.8;pearl(h.x+(b[0]+Math.sin(a)*.018)*h.r,h.y+(b[1]+Math.cos(a*.7)*.016)*h.r,h.r*b[2],.98);});}ctx.globalAlpha=.52;ctx.fillStyle=P.light;for(let i=0;i<10;i++){const a=i*2.399+t*.035,rr=h.r*(.14+.04*(i%4));ctx.beginPath();ctx.ellipse(h.x+Math.cos(a)*rr,h.y+Math.sin(a)*rr*.72,h.r*.06,h.r*.028,a,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;ctx.fillStyle='rgba(255,255,255,.56)';ctx.beginPath();ctx.ellipse(h.x-h.r*.27,h.y-h.r*.36,h.r*.17,h.r*.064,-.52,0,Math.PI*2);ctx.fill();ctx.restore();bodyContour(t);ctx.strokeStyle='rgba(0,8,9,.48)';ctx.lineWidth=Math.max(1.1,Math.min(W,H)*.0035);ctx.stroke();if(state.reaction){const r=state.reaction.region,q=clamp(state.reaction.t,0,1),e=ease(q);const sx=r.x*W,sy=r.y*H,tx=h.x,ty=h.y,P2=pal[r.color];ctx.save();ctx.lineCap='round';for(let k=0;k<7;k++){const wob=Math.sin(t*.8+k)*16;ctx.strokeStyle=k%2?'rgba(0,0,0,.74)':P2.base;ctx.globalAlpha=.72*(1-q);ctx.lineWidth=h.r*(k%2?.055:.08);ctx.beginPath();ctx.moveTo(sx,sy);ctx.bezierCurveTo(lerp(sx,tx,.32)+wob,lerp(sy,ty,.34)-wob*.5,lerp(sx,tx,.68)-wob,lerp(sy,ty,.68)+wob*.35,tx,ty);ctx.stroke();}ctx.restore();}}function tick(ms){const t=ms/1000,dt=Math.min(.033,t-last);last=t;updateColor(dt);updateBody(dt,t);updateRegions(dt,t);drawBackground(t);regions.forEach(r=>drawRegion(r,t));drawPlayer(t);requestAnimationFrame(tick);}requestAnimationFrame(tick);window.__soupTest={state:()=>({color:state.color,changes:state.changes,digests:state.digests,manualSinceDigest:state.manualSinceDigest,unlocked:[...state.unlocked],bodyNodes:body.length,reaction:!!state.reaction,regions:regions.map(r=>({id:r.id,alive:r.alive}))}),points:()=>({player:{x:body[0].x,y:body[0].y},blue:{x:regions[0].x*W,y:regions[0].y*H},green:{x:regions[1].x*W,y:regions[1].y*H}})};})();</script></body></html>
